name: Frontend Quality Gate

on:
  pull_request:
    branches:
      - main
      - hardening/frontend-production-readiness
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: /api

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify supply-chain version contract
        run: npm run verify:supply-chain

      - name: Reject High or Critical npm advisories
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Verify browser session security contract
        run: npm run verify:browser-session

      - name: Run Platform Billing regression suite
        run: npm run test:platform-billing

      - name: Build production bundle
        run: npm run build
