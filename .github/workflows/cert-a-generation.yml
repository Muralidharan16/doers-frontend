name: CERT-A Temporary Generation

on:
  push:
    branches:
      - tmp/cert-a-generation-20260815

permissions:
  contents: read

jobs:
  compatibility-diagnostics:
    name: Inspect dependency compatibility metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary generation ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Query npm registry metadata without changing the tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert-a-diagnostics
          node <<'NODE' | tee cert-a-diagnostics/compatibility.txt
          const { execFileSync } = require('child_process');
          function npmView(spec, field) {
            const args = ['view', spec];
            if (field) args.push(field);
            args.push('--json');
            const out = execFileSync('npm', args, { encoding: 'utf8' }).trim();
            return out ? JSON.parse(out) : null;
          }
          function major(v) { return Number(String(v).split('.')[0]); }

          const versions = npmView('vite', 'versions');
          const vite7 = versions.filter(v => major(v) === 7);
          const tail = vite7.slice(-20);
          console.log(`vite7_latest=${vite7[vite7.length - 1]}`);
          console.log('vite7_esbuild_ranges:');
          for (const v of tail) {
            let range = npmView(`vite@${v}`, 'dependencies.esbuild');
            console.log(`${v} => ${JSON.stringify(range)}`);
          }

          console.log(`react-router-dom@7.18.2=${JSON.stringify(npmView('react-router-dom@7.18.2', 'version'))}`);
          console.log(`react-router-dom@7.18.2 react-router=${JSON.stringify(npmView('react-router-dom@7.18.2', 'dependencies.react-router'))}`);
          console.log(`jsdom@29.1.1 undici=${JSON.stringify(npmView('jsdom@29.1.1', 'dependencies.undici'))}`);
          console.log(`plugin-react@5.2.0 babel=${JSON.stringify(npmView('@vitejs/plugin-react@5.2.0', 'dependencies.@babel/core'))}`);
          console.log(`plugin-react@5.2.0 vite-peer=${JSON.stringify(npmView('@vitejs/plugin-react@5.2.0', 'peerDependencies.vite'))}`);
          console.log(`babel_7_29_6=${JSON.stringify(npmView('@babel/core@7.29.6', 'version'))}`);
          console.log(`undici_7_29_0=${JSON.stringify(npmView('undici@7.29.0', 'version'))}`);
          console.log(`esbuild_0_28_1=${JSON.stringify(npmView('esbuild@0.28.1', 'version'))}`);
          NODE
          git diff --exit-code

      - name: Upload compatibility diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cert-a-compatibility-${{ github.run_id }}
          path: cert-a-diagnostics
          if-no-files-found: error
          retention-days: 3
