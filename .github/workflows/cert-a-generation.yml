name: CERT-A Temporary Generation

on:
  push:
    branches:
      - tmp/cert-a-generation-20260815

permissions:
  contents: write

concurrency:
  group: cert-a-temp-generation
  cancel-in-progress: false

jobs:
  generate-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[cert-a-generated]') }}
    name: Generate and certify warning-clean dependency candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_A_PARENT: de05f9dd0fffe0713a6582a50700e9625758e336
      VITE_API_BASE_URL: /api

    steps:
      - name: Check out temporary generation ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prove isolated generation baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert-a-evidence
          git rev-parse HEAD | tee cert-a-evidence/generation-head.txt
          git rev-parse "$CERT_A_PARENT" | tee cert-a-evidence/certified-parent.txt
          test "$(git diff --name-only "$CERT_A_PARENT" HEAD)" = ".github/workflows/cert-a-generation.yml"
          git diff --exit-code "$CERT_A_PARENT" HEAD -- src scripts package.json package-lock.json vite.config.ts vitest.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json .github/workflows/frontend-quality.yml

      - name: Apply corrected CERT-A manifest targets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.axios = '1.19.0';
          pkg.dependencies['react-router-dom'] = '7.18.2';
          pkg.devDependencies.vite = '7.3.6';
          pkg.devDependencies['@vitejs/plugin-react'] = '^5.0.0';
          pkg.devDependencies.postcss = '^8.5.18';
          pkg.devDependencies.vitest = '4.1.9';
          if (pkg.dependencies?.esbuild) delete pkg.dependencies.esbuild;
          if (pkg.devDependencies?.esbuild) delete pkg.devDependencies.esbuild;
          pkg.scripts['verify:supply-chain'] = 'node scripts/verify-supply-chain.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Remove React dev plugin from Vitest runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vitest.config.ts')
          text = path.read_text()
          text = text.replace("import react from '@vitejs/plugin-react';\n", '')
          text = text.replace('  plugins: [react()],\n', '')
          if "@vitejs/plugin-react" in text or 'plugins: [react()]' in text:
              raise SystemExit('Vitest React plugin removal failed')
          path.write_text(text)
          PY

      - name: Add durable supply-chain verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/verify-supply-chain.mjs <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages ?? {};
          const parse = (value) => {
            const match = String(value ?? '').match(/^(\d+)\.(\d+)\.(\d+)/);
            if (!match) throw new Error(`Invalid semver: ${value}`);
            return match.slice(1).map(Number);
          };
          const gte = (value, floor) => {
            const actual = parse(value), minimum = parse(floor);
            for (let i = 0; i < 3; i += 1) {
              if (actual[i] > minimum[i]) return true;
              if (actual[i] < minimum[i]) return false;
            }
            return true;
          };
          const versionAt = (path) => {
            const value = packages[path]?.version;
            if (!value) throw new Error(`Missing lock entry: ${path}`);
            return value;
          };
          const equal = (actual, expected, label) => {
            if (actual !== expected) throw new Error(`${label}: expected ${expected}, got ${actual}`);
          };
          const atLeast = (actual, floor, label) => {
            if (!gte(actual, floor)) throw new Error(`${label}: expected >=${floor}, got ${actual}`);
          };
          equal(pkg.dependencies.axios, '1.19.0', 'manifest axios');
          equal(pkg.dependencies['react-router-dom'], '7.18.2', 'manifest react-router-dom');
          equal(pkg.devDependencies.vite, '7.3.6', 'manifest vite');
          if (!/^\^5\./.test(pkg.devDependencies['@vitejs/plugin-react'])) throw new Error('manifest plugin-react must remain compatible 5.x');
          equal(pkg.devDependencies.postcss, '^8.5.18', 'manifest postcss');
          equal(pkg.devDependencies.vitest, '4.1.9', 'manifest vitest');
          if (pkg.dependencies?.esbuild || pkg.devDependencies?.esbuild) throw new Error('top-level manifest esbuild must remain absent');
          equal(versionAt('node_modules/axios'), '1.19.0', 'lock axios');
          atLeast(versionAt('node_modules/form-data'), '4.0.6', 'lock form-data');
          atLeast(versionAt('node_modules/react-router-dom'), '7.18.2', 'lock react-router-dom');
          atLeast(versionAt('node_modules/react-router'), '7.18.2', 'lock react-router');
          equal(versionAt('node_modules/vite'), '7.3.6', 'lock vite');
          if (parse(versionAt('node_modules/@vitejs/plugin-react'))[0] !== 5) throw new Error('lock plugin-react must remain 5.x');
          atLeast(versionAt('node_modules/postcss'), '8.5.18', 'lock postcss');
          atLeast(versionAt('node_modules/brace-expansion'), '5.0.8', 'lock brace-expansion');
          atLeast(versionAt('node_modules/esbuild'), '0.28.1', 'lock esbuild');
          atLeast(versionAt('node_modules/@babel/core'), '7.29.6', 'lock @babel/core');
          atLeast(versionAt('node_modules/undici'), '7.29.0', 'lock undici');
          equal(versionAt('node_modules/vitest'), '4.1.9', 'lock vitest');
          console.log('Supply-chain version contract verified.');
          NODE

      - name: Add durable frontend quality supply-chain gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/frontend-quality.yml')
          text = path.read_text()
          needle = "      - name: Lint\n        run: npm run lint\n"
          replacement = "      - name: Verify supply-chain version contract\n        run: npm run verify:supply-chain\n\n      - name: Reject High or Critical npm advisories\n        run: npm audit --audit-level=high\n\n" + needle
          if needle not in text:
              raise SystemExit('frontend quality workflow insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Regenerate lockfile with npm resolver
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee cert-a-evidence/npm-lock-regeneration.log
          npm update brace-expansion @babel/core undici esbuild react-router react-router-dom --package-lock-only --ignore-scripts 2>&1 | tee cert-a-evidence/npm-security-refresh.log

      - name: Verify corrected dependency contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-supply-chain.mjs 2>&1 | tee cert-a-evidence/supply-chain-contract.log
          node <<'NODE' | tee cert-a-evidence/resolved-targets.txt
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const path of ['node_modules/axios','node_modules/form-data','node_modules/react-router-dom','node_modules/react-router','node_modules/vite','node_modules/@vitejs/plugin-react','node_modules/postcss','node_modules/brace-expansion','node_modules/esbuild','node_modules/@babel/core','node_modules/undici','node_modules/vitest']) console.log(`${path}=${lock.packages[path]?.version ?? 'MISSING'}`);
          NODE

      - name: Clean install and dependency tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci 2>&1 | tee cert-a-evidence/npm-ci.log
          npm ls vite @vitejs/plugin-react axios form-data react-router-dom react-router postcss brace-expansion esbuild @babel/core undici vitest --all 2>&1 | tee cert-a-evidence/npm-target-tree.txt
          npm run verify:supply-chain 2>&1 | tee cert-a-evidence/supply-chain-after-ci.log

      - name: Capture and enforce audit evidence
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > cert-a-evidence/npm-audit-production.json
          npm audit --json > cert-a-evidence/npm-audit-all.json
          node <<'NODE' | tee cert-a-evidence/npm-audit-summary.txt
          import fs from 'node:fs';
          let fail = false;
          for (const [label, file] of [['production','cert-a-evidence/npm-audit-production.json'],['all','cert-a-evidence/npm-audit-all.json']]) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const v = data.metadata?.vulnerabilities ?? {};
            console.log(`${label}: info=${v.info ?? 0} low=${v.low ?? 0} moderate=${v.moderate ?? 0} high=${v.high ?? 0} critical=${v.critical ?? 0} total=${v.total ?? 0}`);
            if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) fail = true;
          }
          if (fail) process.exit(1);
          NODE
          npm audit --audit-level=high 2>&1 | tee cert-a-evidence/npm-audit-high-gate.log

      - name: Lint
        run: npm run lint 2>&1 | tee cert-a-evidence/lint.log

      - name: Full frontend test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee cert-a-evidence/tests.log
          grep -Eq '230 passed|Tests[[:space:]]+230 passed' cert-a-evidence/tests.log

      - name: Browser session verifier
        run: npm run verify:browser-session 2>&1 | tee cert-a-evidence/browser-session.log

      - name: Platform Billing regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:platform-billing 2>&1 | tee cert-a-evidence/platform-billing.log
          grep -Eq '80 passed|Tests[[:space:]]+80 passed' cert-a-evidence/platform-billing.log

      - name: TypeScript compile
        run: npx tsc -b --pretty false 2>&1 | tee cert-a-evidence/typescript.log

      - name: Production Vite build
        run: npm run build 2>&1 | tee cert-a-evidence/build.log

      - name: Reject Vite Oxc esbuild compatibility warnings
        shell: bash
        run: |
          set -euo pipefail
          cat cert-a-evidence/tests.log cert-a-evidence/platform-billing.log cert-a-evidence/build.log > cert-a-evidence/toolchain-output.log
          if grep -Eiq '(vite|oxc|esbuild).*(warn|deprecat)|(warn|deprecat).*(vite|oxc|esbuild)|Both esbuild and oxc options were set' cert-a-evidence/toolchain-output.log; then
            echo 'CERT-A warning gate failed: Vite/Oxc/esbuild warning or deprecation detected.' >&2
            exit 1
          fi

      - name: Prove CERT-A scope and candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CERT_A_PARENT" -- src vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json
          test -z "$(git ls-files --others --exclude-standard src)"
          test "$(git ls-files --others --exclude-standard scripts)" = "scripts/verify-supply-chain.mjs"
          git diff --name-only "$CERT_A_PARENT" | tee cert-a-evidence/final-tracked-files.txt
          node <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff','--name-only',process.env.CERT_A_PARENT], {encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const allowed = ['.github/workflows/cert-a-generation.yml','.github/workflows/frontend-quality.yml','package-lock.json','package.json','vitest.config.ts'].sort();
          if (JSON.stringify(files) !== JSON.stringify(allowed)) throw new Error(`unexpected tracked files: ${JSON.stringify(files)}`);
          NODE
          git diff --check "$CERT_A_PARENT"

      - name: Publish generated files to temporary lane only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Muralidharan16'
          git config user.email '145135907+Muralidharan16@users.noreply.github.com'
          git add package.json package-lock.json vitest.config.ts scripts/verify-supply-chain.mjs .github/workflows/frontend-quality.yml
          git diff --cached --check
          git commit -m 'chore: stage CERT-A generated candidate [cert-a-generated] [skip ci]'
          git push origin HEAD:tmp/cert-a-generation-20260815
          git rev-parse HEAD | tee cert-a-evidence/generated-temp-commit.txt

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert-a-output
          cp -R cert-a-evidence cert-a-output/evidence
          printf '%s\n' "$CERT_A_PARENT" > cert-a-output/PARENT_SHA.txt
          git rev-parse HEAD > cert-a-output/GENERATION_REF_SHA.txt

      - name: Upload CERT-A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cert-a-green-${{ github.run_id }}
          path: cert-a-output
          if-no-files-found: error
          retention-days: 3
