<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Doers — Secure Fitness Operations</title>
  <!-- Premium fonts: serif for brand, modern sans for UI -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg-ivory: #f8f6f2;
      --card-white: #ffffff;
      --ink-dark: #1a1a1a;
      --ink-soft: #2c2c2c;
      --text-secondary: #6b6b6b;
      --text-muted: #9a9a9a;
      --border-light: #ece8e2;
      --border-focus: #b8b2a8;
      --graphite-btn: #191919;
      --graphite-hover: #2a2a2a;
      --green-dot: #2b6e3c;
      --glow-radial: rgba(0, 0, 0, 0.02);
      --shadow-card: 0 25px 40px -12px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.01);
      --shadow-card-hover: 0 30px 50px -15px rgba(0, 0, 0, 0.12);
    }

    body {
      background-color: var(--bg-ivory);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink-dark);
      letter-spacing: -0.01em;
      margin: 0;
      min-height: 100vh;
      position: relative;
    }

    /* ---------- Cinematic background layers ---------- */
    .bg-layers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Ultra-subtle grid */
    .grid-texture {
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      position: absolute;
      inset: 0;
    }

    /* Soft radial spotlight behind card area */
    .radial-spotlight {
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 240, 0.6) 0%, rgba(248, 246, 242, 0) 70%);
      position: absolute;
      inset: 0;
    }

    /* Vignette depth */
    .vignette {
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.02) 100%);
      position: absolute;
      inset: 0;
    }

    /* Ultra-fine noise texture */
    .noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.018'/%3E%3C/svg%3E");
      opacity: 0.4;
      mix-blend-mode: multiply;
      position: absolute;
      inset: 0;
    }

    /* ---------- Card premium styling ---------- */
    .card-luxury {
      background: var(--card-white);
      border: 1px solid var(--border-light);
      border-radius: 32px;
      box-shadow: var(--shadow-card);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s ease;
      backdrop-filter: blur(0px);
      width: 100%;
      max-width: 480px;
    }

    .card-luxury:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
    }

    /* Input fields – refined */
    .input-premium {
      width: 100%;
      padding: 14px 18px;
      background-color: white;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
      color: var(--ink-dark);
    }

    .input-premium:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
      background-color: #fefefe;
    }

    .input-premium:hover {
      border-color: #cbc3b8;
    }

    /* Button – deep graphite, elegant */
    .btn-graphite {
      background-color: var(--graphite-btn);
      color: white;
      border-radius: 40px;
      padding: 14px 20px;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      width: 100%;
      text-align: center;
      letter-spacing: -0.2px;
      border: none;
      cursor: pointer;
    }

    .btn-graphite:hover {
      background-color: var(--graphite-hover);
      transform: scale(0.98);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
    }

    .btn-graphite:active {
      transform: scale(0.97);
    }

    /* Status dot with pulse */
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--green-dot);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(43, 110, 60, 0.4);
      animation: pulse-soft 2.2s infinite;
    }

    @keyframes pulse-soft {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(43, 110, 60, 0.3);
      }

      70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 5px rgba(43, 110, 60, 0);
      }

      100% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(43, 110, 60, 0);
      }
    }

    /* Biometric sync animated dots (brand signature) */
    .sync-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .sync-dot {
      width: 3px;
      height: 3px;
      background-color: var(--ink-dark);
      border-radius: 50%;
      opacity: 0.3;
      animation: syncPulse 1.6s ease-in-out infinite;
    }

    .sync-dot:nth-child(2) {
      animation-delay: 0.2s;
      opacity: 0.5;
    }

    .sync-dot:nth-child(3) {
      animation-delay: 0.4s;
      opacity: 0.7;
    }

    @keyframes syncPulse {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Fade-up animation for card */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.65s cubic-bezier(0.15, 0.9, 0.25, 1) forwards;
    }

    /* Breathing glow behind card (ambient) */
    .ambient-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0.02) 0%, transparent 70%);
      border-radius: 48px;
      pointer-events: none;
      transition: opacity 3s ease;
      animation: breathe 6s infinite alternate;
    }

    @keyframes breathe {
      0% {
        opacity: 0.3;
        transform: scale(0.98);
      }

      100% {
        opacity: 0.7;
        transform: scale(1.02);
      }
    }

    /* Security footer links */
    .sec-link {
      color: var(--text-muted);
      transition: color 0.2s;
      text-decoration: none;
    }

    .sec-link:hover {
      color: var(--ink-dark);
    }

    hr {
      border-color: var(--border-light);
    }
  </style>
</head>

<body>
  <!-- Atmospheric background layers -->
  <div class="bg-layers">
    <div class="grid-texture"></div>
    <div class="radial-spotlight"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
  </div>

  <!-- Main content: centered card with premium motion -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-5 py-12">
    <!-- Ambient breathing glow behind card (ultra subtle) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <div class="ambient-glow w-[500px] h-[600px]"></div>
    </div>

    <!-- Authentication Card -->
    <div class="card-luxury animate-fade-up relative">
      <div class="p-8 md:p-9">
        <!-- Brand header with generous spacing -->
        <div class="text-center mb-8">
          <h1
            class="font-['Playfair_Display',Georgia,serif] text-5xl md:text-6xl font-semibold tracking-tight text-[#1a1a1a] leading-[1.1]">
            Doers
          </h1>
          <div class="flex items-center justify-center gap-2 mt-4">
            <span class="text-[10px] font-mono tracking-[0.2em] text-[#7a7a7a] uppercase">Fitness Operations</span>
            <span class="w-1 h-1 rounded-full bg-[#d4d0c8]"></span>
            <span class="text-[10px] font-mono tracking-[0.2em] text-[#7a7a7a] uppercase">Biometric Core</span>
          </div>
          <p class="text-sm md:text-[15px] text-[#5e5e5e] mt-5 max-w-[280px] mx-auto leading-relaxed">
            Secure access for studios & athletic facilities
          </p>
        </div>

        <!-- Login form -->
        <form id="loginForm" class="space-y-6">
          <!-- Email field -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-[0.04em] text-[#4b4b4b] mb-1.5 ml-1">
              Work email
            </label>
            <input type="email" id="email" class="input-premium" placeholder="alex@doers.studio" autocomplete="email">
          </div>

          <!-- Password field with show/hide (refined toggle) -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-[0.04em] text-[#4b4b4b] mb-1.5 ml-1">
              Password
            </label>
            <div class="relative">
              <input type="password" id="password" class="input-premium pr-12" placeholder="··········"
                autocomplete="current-password">
              <button type="button" id="togglePassword"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-[#9a9a9a] hover:text-[#2c2c2c] transition"
                aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Sign-in button -->
          <button type="submit" class="btn-graphite mt-2 text-[16px]">
            Sign in to Console
          </button>

          <!-- Forgot password link -->
          <div class="text-center">
            <a href="#" class="text-[12px] text-[#8a8a8a] hover:text-[#1a1a1a] transition-colors font-medium">Forgot
              password?</a>
          </div>
        </form>
      </div>

      <!-- Operational & security footer – integrated, elegant, informative -->
      <div class="bg-[#fefdfb] border-t border-[#ece8e2] rounded-b-[32px] px-8 py-6">
        <!-- Top row: Systems Online + biometric signature -->
        <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
          <div class="flex items-center gap-2">
            <span class="status-dot"></span>
            <span class="text-[11px] font-mono tracking-[0.04em] text-[#5a5a5a]">Systems Online</span>
            <!-- brand signature: tiny animated sync dots -->
            <div class="sync-dots ml-2">
              <div class="sync-dot"></div>
              <div class="sync-dot"></div>
              <div class="sync-dot"></div>
            </div>
          </div>
          <div class="flex items-center gap-3 text-[10px] font-mono text-[#7a7a7a]">
            <span class="flex items-center gap-1">🔒 AES-256</span>
            <span class="flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2Z" />
              </svg>
              3 biometric devices
            </span>
          </div>
        </div>

        <!-- Security & sync metadata grid (understated) -->
        <div
          class="grid grid-cols-2 gap-y-2 gap-x-3 text-[10px] font-mono text-[#898989] py-2 border-t border-[#ece8e2] mt-1">
          <span>✓ Real‑time attendance</span>
          <span>✓ Secure cloud sync</span>
          <span>✓ Biometric edge</span>
          <span>✓ SOC 2 Type II</span>
        </div>

        <!-- Last sync timestamp (operational reality) -->
        <div class="text-right mt-4 text-[9px] font-mono tracking-wide text-[#b0aba0]">
          Last sync: <span id="liveTimestamp">—</span> UTC
        </div>
      </div>
    </div>
  </div>

  <!-- micro-interaction & password toggle script -->
  <script>
    // Update live timestamp (makes system feel alive)
    function updateTimestamp() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('liveTimestamp').innerText = timeStr;
    }
    updateTimestamp();
    setInterval(updateTimestamp, 1000);

    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        // Change icon style (optional elegance)
        const svg = toggleBtn.querySelector('svg');
        if (type === 'text') {
          svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
          svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
      });
    }

    // Form submit demo (integrate with your real auth later)
    const form = document.getElementById('loginForm');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const btn = document.querySelector('.btn-graphite');
        if (!email.trim()) {
          // subtle feedback – no harsh alert
          const input = document.getElementById('email');
          input.style.borderColor = '#c96a5e';
          setTimeout(() => input.style.borderColor = '', 800);
          return;
        }
        // Simulate premium auth interaction
        const originalText = btn.innerText;
        btn.innerText = 'Authenticating...';
        btn.disabled = true;
        setTimeout(() => {
          btn.innerText = originalText;
          btn.disabled = false;
          alert('🔐 Secure access simulation — integrate with your auth backend.');
        }, 1400);
      });
    }
  </script>
</body>

</html>
