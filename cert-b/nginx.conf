worker_processes 1;
pid /tmp/doers-cert-b/nginx.pid;
error_log /tmp/doers-cert-b/nginx-error.log info;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/doers-cert-b/nginx-access.log;
    sendfile on;

    server {
        listen 8443 ssl;
        server_name cert-b.local;

        ssl_certificate /tmp/doers-cert-b/tls.crt;
        ssl_certificate_key /tmp/doers-cert-b/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        root __FRONTEND_DIST__;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        location ~* \.[0-9A-Za-z_-]{8,}\.(js|css|woff2?|png|svg)$ {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
